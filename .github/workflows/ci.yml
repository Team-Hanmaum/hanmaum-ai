name: AI CI

on:
  pull_request:
    # base 브랜치 제한 없이 일반 PR과 스택 PR을 동일하게 검사한다.
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version
          # PR은 캐시를 읽고, dev·main push에서 캐시를 갱신한다.
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install Python from project version
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check shared fixtures
        run: uv run --locked python scripts/fixture_manifest.py

      - name: Run tests
        run: uv run --locked pytest --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-test-results
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
